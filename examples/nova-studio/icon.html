<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  .icon {
    position: relative;
    width: 1024px;
    height: 1024px;
    border-radius: 224px;
    overflow: hidden;
    background: linear-gradient(158deg, #26303b 0%, #171a1f 52%, #0d0f12 100%);
    box-shadow: inset 0 0 0 8px rgba(255, 255, 255, 0.05);
    font-family: -apple-system, "Helvetica Neue", sans-serif;
  }
  .glow {
    position: absolute;
    left: 92px;
    top: 112px;
    width: 840px;
    height: 840px;
    background: radial-gradient(circle, rgba(90, 200, 255, 0.34) 0%, rgba(90, 200, 255, 0) 62%);
  }
  .window {
    position: absolute;
    left: 148px;
    top: 176px;
    width: 728px;
    height: 672px;
    border-radius: 52px;
    background: #14171b;
    border: 4px solid rgba(120, 200, 255, 0.26);
    box-shadow: 0 48px 110px rgba(0, 0, 0, 0.6);
    overflow: hidden;
  }
  .bar {
    position: relative;
    height: 82px;
    background: #101317;
    border-bottom: 3px solid #1d232a;
    display: flex;
    align-items: center;
    gap: 18px;
    padding-left: 34px;
  }
  .dot { width: 24px; height: 24px; border-radius: 50%; }
  .red { background: #ff5f57; }
  .amber { background: #febc2e; }
  .green { background: #28c840; }
  .pill {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 300px;
    height: 34px;
    border-radius: 17px;
    background: #1c2026;
    border: 2px solid #2a313a;
  }
  .side {
    position: absolute;
    left: 0;
    top: 85px;
    bottom: 0;
    width: 196px;
    background: #181c21;
    border-right: 3px solid #212831;
  }
  .side-row {
    height: 20px;
    margin: 26px 28px;
    border-radius: 10px;
    background: #2b333d;
  }
  .side-row.short { width: 62%; }
  .code { position: absolute; left: 236px; top: 122px; right: 46px; }
  .line { height: 24px; border-radius: 12px; margin-bottom: 26px; }
  .blue { background: #569cd6; }
  .purple { background: #c586c0; }
  .orange { background: #ce9178; }
  .aqua { background: #4ec9b0; }
  .grey { background: #3a424c; }
  .w60 { width: 60%; }
  .w74 { width: 74%; }
  .w40 { width: 40%; }
  .w86 { width: 86%; }
  .star {
    position: absolute;
    right: 196px;
    bottom: 132px;
    font-size: 132px;
    line-height: 1;
    color: #7fd4ff;
    text-shadow: 0 0 42px rgba(90, 200, 255, 0.75);
  }
</style>
</head>
<body>
  <div class="icon">
    <div class="glow"></div>
    <div class="window">
      <div class="bar">
        <div class="dot red"></div>
        <div class="dot amber"></div>
        <div class="dot green"></div>
        <div class="pill"></div>
      </div>
      <div class="side">
        <div class="side-row"></div>
        <div class="side-row short"></div>
        <div class="side-row short"></div>
        <div class="side-row"></div>
        <div class="side-row short"></div>
        <div class="side-row"></div>
        <div class="side-row short"></div>
      </div>
      <div class="code">
        <div class="line blue w60"></div>
        <div class="line purple w40"></div>
        <div class="line grey w86"></div>
        <div class="line orange w74"></div>
        <div class="line grey w60"></div>
        <div class="line aqua w40"></div>
        <div class="line grey w74"></div>
        <div class="line blue w40"></div>
        <div class="line grey w86"></div>
        <div class="line purple w60"></div>
      </div>
    </div>
    <div class="star">✦</div>
  </div>
</body>
</html>
