<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; width: 1024px; height: 1024px; background: #07090d; }
    </style>
  </head>
  <body>
    <svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="bg" cx="32%" cy="18%" r="95%">
          <stop offset="0" stop-color="#1c2940" />
          <stop offset="0.52" stop-color="#0f1622" />
          <stop offset="1" stop-color="#07090d" />
        </radialGradient>
        <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#8cf3ff" />
          <stop offset="0.45" stop-color="#4aa8ff" />
          <stop offset="1" stop-color="#b07cff" />
        </linearGradient>
        <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#8cf3ff" stop-opacity="0.30" />
          <stop offset="1" stop-color="#4aa8ff" stop-opacity="0.10" />
        </linearGradient>
        <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#4aa8ff" stop-opacity="0.18" />
          <stop offset="1" stop-color="#4aa8ff" stop-opacity="0.04" />
        </linearGradient>
        <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#b07cff" stop-opacity="0.22" />
          <stop offset="1" stop-color="#b07cff" stop-opacity="0.05" />
        </linearGradient>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="14" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>

      <rect width="1024" height="1024" rx="220" fill="url(#bg)" />
      <rect x="14" y="14" width="996" height="996" rx="208" fill="none" stroke="#26344a" stroke-width="8" />

      <!-- faint studio grid -->
      <g stroke="#3d5a80" stroke-opacity="0.18" stroke-width="3">
        <path d="M120 736 H904" />
        <path d="M120 800 H904" />
        <path d="M120 864 H904" />
        <path d="M248 672 H776" />
      </g>

      <!-- isometric engine core -->
      <g filter="url(#glow)">
        <polygon points="512,196 812,368 512,540 212,368" fill="url(#top)" stroke="url(#edge)" stroke-width="18" stroke-linejoin="round" />
        <polygon points="212,368 512,540 512,884 212,712" fill="url(#left)" stroke="url(#edge)" stroke-width="18" stroke-linejoin="round" />
        <polygon points="812,368 512,540 512,884 812,712" fill="url(#right)" stroke="url(#edge)" stroke-width="18" stroke-linejoin="round" />
      </g>

      <!-- inner struts suggest a mesh, not a solid box -->
      <g stroke="#8cf3ff" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round">
        <path d="M212 368 L512 540 L812 368" fill="none" />
        <path d="M512 540 L512 884" />
        <path d="M362 282 L662 454" />
        <path d="M362 454 L662 282" />
        <path d="M362 626 L662 798" />
        <path d="M362 798 L662 626" />
      </g>

      <!-- bright core -->
      <circle cx="512" cy="540" r="44" fill="#eafaff" />
      <circle cx="512" cy="540" r="96" fill="#8cf3ff" fill-opacity="0.22" />

      <text x="512" y="958" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
            font-size="54" font-weight="700" letter-spacing="14" fill="#dcecff">NOVA ENGINE</text>
    </svg>
  </body>
</html>
