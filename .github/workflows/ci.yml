name: CI

on:
  push:
  pull_request:

jobs:
  nova:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build the compiler with its Nova bootstrap
        run: (cd examples/nova-tool && ../../bootstrap/nova build)
      - name: Compiler suites
        run: |
          sh examples/nova-tool/tests/codegen.sh
          sh examples/nova-tool/tests/diff.sh
          sh examples/nova-tool/tests/diff-errors.sh
          sh examples/nova-tool/tests/parser.sh
          sh examples/nova-tool/tests/sema.sh
          sh examples/nova-tool/tests/sema-ast.sh
          sh examples/nova-tool/tests/cli.sh
          sh examples/nova-tool/tests/lsp.sh
      - name: Toolchain and package suites
        run: |
          sh examples/nova-tool/tests/boxes.sh
          sh examples/nova-tool/tests/formatter.sh
          sh examples/nova-tool/tests/toolchain.sh

  editor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run package

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: apps/website/package-lock.json
      - name: Install website dependencies
        working-directory: apps/website
        run: npm ci --no-audit --no-fund
      - name: Verify checked-in playground artifacts
        working-directory: apps/website
        run: npm run test:playground
      - name: Astro check and lint
        working-directory: apps/website
        run: |
          npm run check
          npm run lint
      - name: Build at root
        working-directory: apps/website
        run: npm run build
      - name: Verify grammar, links and routes
        working-directory: apps/website
        run: |
          npm run test:grammar
          npm run test:playground
          npm run test:site
      - name: Build at project base
        working-directory: apps/website
        env:
          BASE_PATH: /nova/
          SITE_URL: https://example.github.io
        run: |
          npm run build
          npm run test:site
