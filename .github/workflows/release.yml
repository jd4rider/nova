name: Package installers

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or commit to package
        required: true
        default: main

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Install Studio dependencies
        working-directory: editor
        run: npm ci --no-audit --no-fund

      - name: Build macOS and Windows installers
        working-directory: editor
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm run dist:mac
          npm run dist:win

      - name: Build CLI archive and source archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo build --release -p nova-cli
          mkdir -p "release-assets/nova-${version}-aarch64-apple-darwin"
          cp target/release/nova "release-assets/nova-${version}-aarch64-apple-darwin/nova"
          cp README.md "release-assets/nova-${version}-aarch64-apple-darwin/README.md"
          tar -C release-assets -czf "release-assets/nova-${version}-aarch64-apple-darwin.tar.gz" \
            "nova-${version}-aarch64-apple-darwin"
          cp "editor/release/Nova-Studio-${version}-arm64.dmg" release-assets/
          cp "editor/release/Nova-Studio-${version}-arm64.zip" release-assets/
          cp "editor/release/Nova-Studio-${version}-x64-setup.exe" release-assets/
          git archive --format=tar.gz --prefix="nova-${version}/" \
            -o "release-assets/nova-${version}-source.tar.gz" HEAD
          cd release-assets
          shasum -a 256 * > SHA256SUMS

      - name: Upload installer bundle
        uses: actions/upload-artifact@v4
        with:
          name: nova-installers
          path: release-assets/*
